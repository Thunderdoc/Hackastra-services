# Hackstra — Render Blueprint (free-tier DEMO).
# Database: bundled inside the container by default (data re-seeds on
# every restart). PERSISTENT MODE: set the DB_* env vars below in the
# Render dashboard to an external hosted MySQL/MariaDB and the app
# switches automatically — the external database is migrated, never
# wiped, and school data survives every deploy (see
# docker/entrypoint.render.sh).
services:
  - type: web
    name: hackastra
    env: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: "480"
      - key: APP_KEY
        sync: false # set once in the Render dashboard (never commit a real key)
      # Persistent database (optional): fill ALL of these in the
      # dashboard with an external MySQL/MariaDB to make school data
      # survive deploys. Leave them unset for the bundled demo DB.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
