<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171819">
    <title>Offline | Hackstra Academy</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #171819; color: #e7e8e9; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
        .box { padding: 24px; max-width: 320px; }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { color: #9aa0a6; font-size: 0.95rem; }
        button { margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 8px;
                 background: #3478f6; color: #fff; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>You're offline</h1>
        <p>Hackstra Academy needs an internet connection. Check your connection and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
